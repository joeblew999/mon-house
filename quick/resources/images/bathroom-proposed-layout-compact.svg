<svg width="680" height="850" viewBox="-150 -100 1900 2150" xmlns="http://www.w3.org/2000/svg">
  <!-- Opaque background -->
  <rect x="-150" y="-100" width="1900" height="2150" fill="white"/>

  <!-- Room Outline (1380 x 1950) -->
  <rect x="0" y="0" width="1380" height="1950" fill="none" stroke="black" stroke-width="10"/>

  <!-- Full Width Shower (Back Wall) -->
  <rect x="0" y="1250" width="1380" height="700" fill="#aec6cf" fill-opacity="0.5" stroke="black" stroke-width="2"/>
  <text x="690" y="1600" font-family="Arial" font-size="50" font-weight="bold" text-anchor="middle">FULL SHOWER (1380x700)</text>

  <!-- Shower Glass Screen (700mm wide from the Left) -->
  <line x1="0" y1="1250" x2="700" y2="1250" stroke="#00ced1" stroke-width="15"/>
  <text x="350" y="1200" font-family="Arial" font-size="40" fill="#008b8b" font-weight="bold" text-anchor="middle">700mm GLASS SCREEN</text>

  <!-- Shower Entry Gap (680mm on the Right) -->
  <text x="1040" y="1230" font-family="Arial" font-size="35" text-anchor="middle">680mm ENTRY</text>

  <!-- Toilet (Left Wall: 480mm Deep, 500mm Wide) -->
  <rect x="0" y="600" width="480" height="500" fill="#ffb347" fill-opacity="0.7" stroke="black" stroke-width="2"/>
  <text x="240" y="850" font-family="Arial" font-size="45" font-weight="bold" text-anchor="middle">TOILET</text>

  <!-- Basin (Left Wall: 300mm Deep, 450mm Wide) -->
  <rect x="0" y="50" width="300" height="450" fill="#b39eb5" fill-opacity="0.7" stroke="black" stroke-width="2"/>
  <text x="150" y="275" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle">BASIN</text>

  <!-- Cabinet (Right Wall, opposite toilet: 200mm Deep, 530mm Long, wall-hung) -->
  <rect x="1180" y="720" width="200" height="530" fill="#d4b896" fill-opacity="0.7" stroke="black" stroke-width="2"/>
  <text x="1280" y="1000" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle">CABINET</text>

  <!-- Mirror (Left wall: from shower glass at y=1250 up to entry wall at y=0, above basin + toilet) -->
  <line x1="5" y1="0" x2="5" y2="1250" stroke="#00ced1" stroke-width="10"/>
  <text x="-50" y="625" font-family="Arial" font-size="40" fill="#008b8b" font-weight="bold" text-anchor="middle" transform="rotate(-90, -50, 625)">1250mm MIRROR</text>

  <!-- Door (700mm wide, 100mm offset from RIGHT wall, swinging IN) -->
  <!-- Door hinge at 1280 (1380 - 100) -->
  <line x1="1280" y1="0" x2="1280" y2="700" stroke="red" stroke-width="10"/>
  <path d="M 1280 700 A 700 700 0 0 1 580 0" fill="none" stroke="red" stroke-dasharray="20,10" stroke-width="5"/>
  <text x="1230" y="350" font-family="Arial" font-size="40" fill="red" font-weight="bold" transform="rotate(90, 1230, 350)">700mm DOOR</text>

  <!-- Vertical Spacing Labels (Along the 1950mm wall) -->
  <g fill="blue" font-family="Arial" font-size="35" font-weight="bold" text-anchor="start">
    <text x="1400" y="1600">700 (Shower)</text>
    <text x="1400" y="1175">150 (Gap)</text>
    <text x="1400" y="850">500 (Toilet)</text>
    <text x="1400" y="550">100 (Gap)</text>
    <text x="1400" y="275">450 (Basin)</text>
    <text x="1400" y="25">50 (Gap)</text>
  </g>

  <!-- Horizontal Projection Labels -->
  <text x="240" y="580" font-family="Arial" font-size="35" fill="purple" text-anchor="middle">480mm PROJECTION</text>
  <text x="150" y="30" font-family="Arial" font-size="35" fill="purple" text-anchor="middle">300mm PROJECTION</text>

  <!-- Room Width Label -->
  <text x="690" y="-30" font-family="Arial" font-size="45" fill="green" font-weight="bold" text-anchor="middle">1380mm TOTAL WIDTH</text>
</svg>
