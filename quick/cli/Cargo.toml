[package]
name = "quick-tool"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"   # minimum version — clap 4 + anyhow 1 require ~1.70

description = "Bilingual construction spec pipeline: font management and markdown translation"
license = "MIT"
repository = "https://github.com/joeblew999/mon-house"
homepage   = "https://github.com/joeblew999/mon-house"
keywords   = ["typst", "pdf", "translation", "fonts", "mise"]
categories = ["command-line-utilities", "development-tools"]

# ── How to install via mise ────────────────────────────────────────────────────
#
# Once published to crates.io (cargo publish --manifest-path cli/Cargo.toml):
#   mise use cargo:quick-tool          # installs from crates.io
#
# From git (works because quick/Cargo.toml is a workspace root):
#   mise use cargo:joeblew999/mon-house  # GitHub shorthand
#   # or full URL:
#   mise use 'cargo:https://github.com/joeblew999/mon-house'
#
# From a local checkout (e.g. in CI or development):
#   mise use cargo:path:quick/cli      # from repo root
#   mise use cargo:path:cli            # from quick/ directory
#
# After installation the binary is in mise's shims PATH as 'quick-tool'.
# The mise.toml [tools] entry becomes:
#   [tools]
#   "cargo:quick-tool" = "0.1"
#
# ── mise variable passing (the standard pattern) ──────────────────────────────
#
# mise [env] sets real OS environment variables for every subprocess it spawns.
# clap reads them via env = "VAR_NAME" with precedence:
#   CLI flag  >  env var (set by mise [env])  >  compiled default
#
# Override for one machine without touching mise.toml:
#   # mise.local.toml  (gitignored)
#   [env]
#   QUICK_FONT_DIR = "/tmp/my-fonts"
# ──────────────────────────────────────────────────────────────────────────────

# Files that add no value to a published crate
exclude = [
    "target/",
    "fonts/",
    "out/",
    "*.th.md",
    "*.th.md.cache.json",
]

[[bin]]
name = "quick-tool"
path = "src/main.rs"

[dependencies]
# CLI — "env" feature lets clap read env vars, auto-documented in --help
clap = { version = "4", features = ["derive", "env"] }

# HTTP — sync, native targets only.
# Gated behind `native-http` feature; omitted for WASM/Cloudflare builds.
# Cloudflare Workers use worker::Fetch (async) in cf/src/translate.rs instead.
ureq = { version = "2", features = ["json"], optional = true }

# JSON — GWFH API responses
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing — BLAKE3 stamp files for idempotency layers 2 and 3
# Faster than SHA-256, simpler API, compiles to WASM natively (no getrandom needed)
blake3 = "1"

# Regex — parse `font: (...)` stack from theme.typ
regex = "1"

# Work-stealing thread pool — parallel chunk translation in translate.rs.
# 4-8 chunks fire HTTP at once instead of serial; first-time spec translates
# go from minutes to seconds. CF Worker handles concurrent requests fine.
rayon = "1"

# Cross-platform helpers (replace manual shell/Python equivalents):
glob       = "0.3" # file patterns — replaces bash `for f in [A-Z]*.md`
urlencoding = "2"  # URL encode GWFH search query

# Find executables in PATH — used by fonts (typst), themes (typst), translate (claude CLI).
# All callers are local-only; wasm32 target doesn't support process spawning.
# Gated behind `local` feature; omitted for WASM/Cloudflare builds.
which = { version = "6", optional = true }

# Cross-platform home dir — only needed for VSCode extension discovery in translate.rs.
# Gated behind `local` feature; omitted on Cloudflare builds.
dirs = { version = "5", optional = true }

# File-system watcher — replaces the TypeScript chokidar watcher in quick/local/.
# Powers `quick-tool watch` for local dev. Local-only — Cloudflare/WASM builds
# don't have an FS to watch. Debouncer rolls bursts of save events into one.
notify-debouncer-mini = { version = "0.4", optional = true }

# HTTP server — compile-server endpoint inside CF Container (serve subcommand)
tiny_http = { version = "0.12", optional = true }

# TOML parsing — theme registry
toml = { version = "0.8", features = ["parse"] }

# TypeScript type generation — emits .ts interfaces from Rust structs via `cargo test`
ts-rs = { version = "10", features = ["serde-compat"] }

# Ergonomic errors
anyhow = "1"

[features]
# `local` enables OS-level subsystems that do not exist on Cloudflare Workers:
#   - notify (file watching)       — no filesystem events on WASM
#   - watch subcommand             — gated in main.rs / watch.rs
#
# Local CLI (default):   cargo build
# Cloudflare Workers:    cargo build --no-default-features
# `native-http` — sync ureq HTTP. Required for local CLI; not available on WASM.
# `local`       — all OS-level subsystems: native-http + file watching + claude CLI discovery.
# Cloudflare:   cargo build --no-default-features  (neither feature enabled)
default     = ["local"]
local       = ["native-http", "dep:dirs", "dep:which", "dep:notify-debouncer-mini"]
native-http = ["dep:ureq"]
# `container` — minimal feature set for the CF Container image.
# Only tiny_http (serve subcommand) is needed; no file watching, no WS client.
# Build: cargo build --release --no-default-features --features container
container   = ["dep:tiny_http", "dep:which"]

[dev-dependencies]
# Used by integration tests in tests/pipeline_e2e.rs to enumerate spec files
glob = "0.3"
