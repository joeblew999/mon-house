[package]
name    = "quick-compiler"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cloudflare Worker (workers-rs): typst → PDF compile API"

[lib]
crate-type = ["cdylib"]

[dependencies]
typst        = "0.14"
typst-pdf    = "0.14"
typst-as-lib = { version = "0.15", default-features = false }

worker       = "0.8"
getrandom    = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
