[task_config]
# Shared joeblew999 task library — provides cf:token-check, cf:access-setup,
# wrangler:tail/secret-list, rust:build/test, prove:bindings. Same library
# kv-manager and other repos pull in so task names stay consistent across the org.
#
# cf:access-setup is used here — it reads cf/config/production.env and
# provisions a Cloudflare Access App + email-allowlist policy in front of
# the Worker. See cf/COSTS.md "Auth gate" section.
#
# Not used here: cf:provision-d1-r2 / cf:secrets-put-mapped / wrangler:gen /
# prove:secrets|access-policy|deployed — those assume D1, templated wrangler.toml,
# and the full secrets-mapping flow. quick/ deploys with a single ANTHROPIC_API_KEY
# secret and a static wrangler.toml.
includes = ["git::https://github.com/joeblew999/.github.git//mise-tasks?ref=v0.20.0"]

[tools]
typst                  = "latest"
node                   = "lts"       # required by wrangler
"npm:wrangler"         = "4.87.0"    # Cloudflare Workers CLI
"github:jdx/fnox"      = "1.23"      # secret retrieval (used by cf:token-check via shared mise-tasks)
"github:nushell/nushell" = "0.112"  # required by .github v0.10.0+ (all shared mise-tasks are nu)
"cargo:worker-build"   = "0.8.1"     # workers-rs WASM bundler — used by quick-compiler/
"cargo:cargo-leptos"   = "0.2"       # leptos compound build (SSR Worker + hydrate browser)
# WASM toolchain for the browser/Tauri build of the Rust core (cli/).
# Versions MUST match between the cargo crate (cli/Cargo.toml `wasm-bindgen`)
# and the bindgen CLI here — bindgen errors loudly on mismatch.
"cargo:wasm-bindgen-cli" = "0.2.120" # JS interop glue generator (must match workspace-locked wasm-bindgen)
"aqua:WebAssembly/binaryen" = "121"  # wasm-opt — size optimisation (-Oz)
# watchexec removed — quick-tool watch (notify crate) handles file watching natively
# uv removed — Python scripts (scripts/fonts.py, scripts/translate_markdown.py) removed;
#              all functionality is now in the Rust CLI (cli/)

# ── quick-tool install modes ───────────────────────────────────────────────────
# Development (default): built from source by [tasks.build-cli], binary at
#   cli/target/release/quick-tool  (referenced via vars.QUICK_TOOL below)
#
# Installed as a mise tool — uncomment ONE of these lines instead:
#
#   "cargo:quick-tool"       = "latest"   # from crates.io (once published)
#   "cargo:joeblew999/mon-house" = "latest"  # from GitHub (workspace root = quick/)
#   "cargo:path:cli"         = "latest"   # from local path (run from quick/)
#
# When using the installed form, change vars.QUICK_TOOL to just "quick-tool"
# so mise picks it up from its shims PATH instead of the local build output.
# ──────────────────────────────────────────────────────────────────────────────

# ── env vars passed to quick-tool ─────────────────────────────────────────────
# These are the overridable defaults. The Rust binary reads them via clap's
# `env =` attribute, so precedence is: CLI flag > env var > compiled default.
# Override any of these in a local mise.local.toml without touching this file.
[env]
# ── Directory layout ──────────────────────────────────────────────────────────
# Change these in mise.local.toml (gitignored) to point at S3 mounts, NFS
# shares, or any path — the Rust binary reads them all via env vars.

# Runtime assets (fonts, images) — could be an S3 mount
QUICK_RESOURCES_DIR = "resources"
QUICK_FONT_DIR      = "{{env.QUICK_RESOURCES_DIR}}/fonts"
QUICK_IMAGES_DIR    = "{{env.QUICK_RESOURCES_DIR}}/images"

# Generated PDF output — could be an S3 mount
QUICK_OUT_DIR       = "out"

# Typst theme scripts — versioned source, rarely changes
QUICK_SCRIPTS_DIR   = "scripts"

# Spec source files (EN markdown)
QUICK_SPECS_DIR     = "specs"

# Quantity-data source — JSON catalogues + colocated `.nu` generators.
# Watch loop monitors this directory; changes trigger `mise run gen` which
# regenerates `specs/_partials/tile-quantity-*.md` (and future paint-quantity-*).
QUICK_DATA_DIR      = "data"

# Template file used by `mise run new` to scaffold a new spec
QUICK_TEMPLATE_FILE = "TEMPLATE.md"

QUICK_GWFH_API      = "https://gwfh.mranftl.com/api/fonts"
QUICK_WEIGHTS       = "400,700"

# ── Translation backend ───────────────────────────────────────────────────────
# Default: route translations through the live CF Worker, which uses the
# Workers AI binding (SEA-LION 27B fine-tuned for Thai). No local Claude CLI
# or ANTHROPIC_API_KEY needed — everything runs on Cloudflare.
#
# To force the local Claude CLI / Anthropic API instead (e.g. for offline work
# or quality A/B testing), unset in mise.local.toml:
#   [env]
#   QUICK_TRANSLATE_URL = ""
QUICK_TRANSLATE_URL = "https://quick-worker.gedw99.workers.dev/translate"

# ── Cloudflare ────────────────────────────────────────────────────────────────
# Override in mise.local.toml (gitignored) — never commit CF credentials here.
# CF_API_TOKEN and CF_ACCOUNT_ID are read by wrangler automatically from env.
CF_WORKER_DIR = "cf"   # where the Cloudflare Worker project lives

# CF Worker Agent WebSocket endpoint.
# Local dev (mise run cf:dev):   ws://localhost:8787/agents/PipelineAgent/default
# Production (deployed worker):  wss://quick-worker.gedw99.workers.dev/agents/PipelineAgent/default
# Unset: local pipeline (translate via claude CLI / ANTHROPIC_API_KEY, build via typst).

# CF PipelineAgent WebSocket URL — when set, `mise run watch` sends spec files
# to the Agent over WebSocket and receives translated .th.md (+ PDFs) back.
# NOTE: URL uses kebab-case of binding name: PipelineAgent → pipeline-agent
# Local dev:   ws://localhost:8787/agents/pipeline-agent/default
# Production:  wss://quick-worker.gedw99.workers.dev/agents/pipeline-agent/default
# QUICK_AGENT_URL = "ws://localhost:8787/agents/pipeline-agent/default"
# QUICK_AGENT_URL = "wss://quick-worker.gedw99.workers.dev/agents/pipeline-agent/default"

# ── vars used in task run strings ─────────────────────────────────────────────
[vars]
# Path to the quick-tool binary.
#
# Development (default): local build output from [tasks.build-cli]
QUICK_TOOL = "target/release/quick-tool"
#
# Switch to this when quick-tool is installed as a mise tool (see [tools] above):
# QUICK_TOOL = "quick-tool"
#
# Windows: local build output uses .exe extension:
# QUICK_TOOL = "target/release/quick-tool.exe"

# ── tasks ──────────────────────────────────────────────────────────────────────

[tasks.codegen]
description = "Generate TypeScript bindings from Rust types (cli/bindings/*.ts)"
sources  = ["cli/src/translate.rs"]
outputs  = ["cli/bindings/TranslateRequest.ts", "cli/bindings/TranslateResponse.ts", "cli/bindings/ErrorResponse.ts"]
run = "cargo test --lib export_bindings --manifest-path cli/Cargo.toml"

[tasks.gen]
description = "Regenerate quantity-table partials from data/*.json (tile counts, box counts, costs). Idempotent — second run does no work. Runs every *.nu generator in data/ via quick-tool gen, so adding paint.nu / fasteners.nu / etc. needs no mise.toml edit."
depends = ["build-cli"]
sources  = ["{{env.QUICK_DATA_DIR}}/*.json", "{{env.QUICK_DATA_DIR}}/*.nu"]
outputs  = [
  "{{env.QUICK_SPECS_DIR}}/_partials/tile-quantity-bathroom-basic.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/tile-quantity-bathroom-compact.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/tile-quantity-bathroom-enlarge.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/tile-quantity-house-wide.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/paint-quantity-house-exterior-concrete.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/paint-quantity-house-exterior-timber.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/window-quantity-windows-02.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/curtain-quantity-windows-02-curtains.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/curtain-quantity-windows-02-curtains-eyelet.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/curtain-quantity-windows-02-curtain-hardware.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/cost-summary-bathroom-basic.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/cost-summary-bathroom-compact.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/cost-summary-bathroom-enlarge.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/cost-summary-house-exterior.md",
  "{{env.QUICK_SPECS_DIR}}/_partials/cost-summary-windows-02.md",
]
run = "{{vars.QUICK_TOOL}} gen"

[tasks.build-cli]
description = "Compile quick-tool (Rust) — skipped automatically if sources unchanged"
sources  = ["cli/src/**/*.rs", "cli/Cargo.toml", "Cargo.lock"]
outputs  = ["target/release/quick-tool"]  # Windows: override to quick-tool.exe in mise.local.toml
run = "cargo build --release --manifest-path cli/Cargo.toml"

[tasks.build-wasm]
description = "Compile quick-tool engine to WASM for browser/Tauri (cdylib + wasm-bindgen + wasm-opt). Stages artifacts into cf/src/wasm/ so Vite can import them."
sources  = ["cli/src/**/*.rs", "cli/Cargo.toml", "Cargo.lock"]
outputs  = [
  "target/wasm-pkg/quick_tool_bg.wasm",
  "target/wasm-pkg/quick_tool.js",
  "{{env.CF_WORKER_DIR}}/src/wasm/quick_tool_bg.wasm",
  "{{env.CF_WORKER_DIR}}/src/wasm/quick_tool.js",
]
# Pipeline: cargo → wasm-bindgen → wasm-opt -Oz
# 1. cargo build  : compile cdylib for wasm32-unknown-unknown with the `wasm` feature
# 2. wasm-bindgen : generate JS bindings + .d.ts types into target/wasm-pkg/
# 3. wasm-opt -Oz : optimise for size (typically halves the artifact)
# All three tools come from mise (cargo:wasm-bindgen-cli, aqua:WebAssembly/binaryen).
run = """
cargo build --manifest-path cli/Cargo.toml --target wasm32-unknown-unknown --release --no-default-features --features wasm
wasm-bindgen --target web --out-dir target/wasm-pkg target/wasm32-unknown-unknown/release/quick_tool.wasm
wasm-opt -Oz --strip-debug --strip-producers --vacuum --converge \
  target/wasm-pkg/quick_tool_bg.wasm -o target/wasm-pkg/quick_tool_bg.wasm.opt
mv target/wasm-pkg/quick_tool_bg.wasm.opt target/wasm-pkg/quick_tool_bg.wasm
mkdir -p {{env.CF_WORKER_DIR}}/src/wasm
cp target/wasm-pkg/quick_tool.js target/wasm-pkg/quick_tool.d.ts target/wasm-pkg/quick_tool_bg.wasm target/wasm-pkg/quick_tool_bg.wasm.d.ts {{env.CF_WORKER_DIR}}/src/wasm/
echo "✓ WASM bundle:"
for f in target/wasm-pkg/quick_tool_bg.wasm target/wasm-pkg/quick_tool.js; do
  raw=$(wc -c < $f | awk '{printf "%.1f KB", $1/1024}')
  gz=$(gzip -c $f | wc -c | awk '{printf "%.1f KB", $1/1024}')
  echo "  $(basename $f): $raw raw, gzip $gz"
done
echo "✓ Staged into {{env.CF_WORKER_DIR}}/src/wasm/ for Vite import"
"""

[tasks.fonts]
description = "Download fonts declared in scripts/theme.typ into fonts/"
depends  = ["build-cli"]
sources  = ["{{env.QUICK_SCRIPTS_DIR}}/theme.typ"]
outputs  = ["{{env.QUICK_FONT_DIR}}/.done"]
run = "{{vars.QUICK_TOOL}} fonts download"

[tasks."fonts:test"]
description = "Verify fonts system: health (files, typst, stamp) + idempotency (all 3 layers)"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} fonts test-all"

[tasks."fonts:search"]
description = "Search GWFH registry by name. Usage: mise run fonts:search -- 'noto sans thai'"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} fonts search $@"

[tasks.clean]
description = "Remove generated PDFs in out/"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} clean"

[tasks.translate]
description = "Translate *.md → *.th.md (skips unchanged files via SHA-256 hash)"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} translate"

[tasks.all]
description = "Translate (if changed) then build EN + Thai PDFs (mise skips if outputs are up to date)"
depends = ["translate"]
sources  = [
  "{{env.QUICK_SPECS_DIR}}/[A-Z]*.th.md",
  "{{env.QUICK_SCRIPTS_DIR}}/theme.typ",
  "{{env.QUICK_IMAGES_DIR}}/**/*",
]
outputs  = ["{{env.QUICK_OUT_DIR}}/.build-stamp"]
run = "{{vars.QUICK_TOOL}} build"

[tasks.one]
description = "Translate (if changed) and build PDFs for a single file. Usage: mise run one -- GATE"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} one $@"

[tasks.new]
description = "Create a new spec file from TEMPLATE.md. Usage: mise run new -- SPECNAME"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} new $@"

[tasks.watch]
description = "Watch specs/, scripts/, and resources/images/ for changes; re-translate (chunked, cached) and rebuild affected PDFs. All-local — no CF round-trip."
depends = ["build-cli"]
env = { QUICK_TRANSLATE_URL = "https://quick-worker.gedw99.workers.dev/translate" }
run = "{{vars.QUICK_TOOL}} watch"

[tasks."themes:list"]
description = "List all available themes with descriptions; marks the active one"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} themes list"

[tasks."themes:current"]
description = "Show the currently active theme name and file path"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} themes current"

[tasks."themes:switch"]
description = "Switch active theme. Usage: mise run themes:switch -- minimal"
depends = ["build-cli"]
run = "{{vars.QUICK_TOOL}} themes switch $@"

[tasks."themes:test"]
description = "Compile a test PDF with the current theme (verifies cmarker+typst round-trip)"
depends = ["build-cli", "fonts"]
run = "{{vars.QUICK_TOOL}} themes test $@"

[tasks."themes:test-all"]
description = "Compile test PDFs for ALL themes in the registry (uses cmarker, no pandoc)"
depends = ["build-cli", "fonts"]
run = "{{vars.QUICK_TOOL}} themes test --all"

[tasks."themes:check"]
description = "Full health check: wrapper, registry, file presence, compile round-trip (uses cmarker)"
depends = ["build-cli", "fonts"]
run = "{{vars.QUICK_TOOL}} themes check"

# ── tests ───────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run all tests: unit (no tools) + integration E2E (requires typst, fonts)"
depends = ["build-cli", "fonts", "all"]
run = """
cargo test --manifest-path cli/Cargo.toml
cargo test --manifest-path cli/Cargo.toml -- --ignored
"""

[tasks."test:unit"]
description = "Run unit tests only — no pandoc/typst/fonts required; instant feedback"
depends = ["build-cli"]
run = "cargo test --manifest-path cli/Cargo.toml"

[tasks."test:e2e"]
description = "Run E2E integration tests only (requires typst, fonts, all PDFs built)"
depends = ["build-cli", "fonts", "all"]
# --test-threads=1: tests share the quick/ directory (theme switches, PDFs, stamps)
# and must run serially to avoid interference
run = "cargo test --manifest-path cli/Cargo.toml -- --ignored --test-threads 1"

[tasks."test:theme"]
description = "Run E2E tests with a specific theme. Usage: mise run test:theme -- compact"
depends = ["build-cli", "fonts", "all"]
run = "QUICK_TEST_THEME=$1 cargo test --manifest-path cli/Cargo.toml -- --ignored"

# ── Cloudflare deploy lifecycle (phase-numbered, matching kv-manager shape) ───
#
# All wrangler-using tasks below wrap their command with `fnox exec --` so the
# CLOUDFLARE_API_TOKEN stored in the OS keychain (via fnox) is injected at the
# moment wrangler runs. No external wrapper needed; `mise run <task>` Just Works.
#
# Fresh-machine setup (one time):
#   1. fnox set --global -p keychain CLOUDFLARE_API_TOKEN  # one-time per machine
#   2. mise run 1-install
#   3. mise exec -- wrangler secret put ANTHROPIC_API_KEY  # one-time, in cf/
#   4. mise run 10-deploy
#
# Day-to-day:
#   mise run dev            # Vite + miniflare locally
#   mise run 10b-redeploy   # quick redeploy after wrangler.toml/secret tweaks
#   mise run tail           # live worker logs
#   mise run prove:bindings # verify wrangler.toml bindings via dry-run

[tasks."1-install"]
description = "Fresh-machine: install npm deps for cf/ + build quick-tool"
depends = ["build-cli"]
run = """
cd {{env.CF_WORKER_DIR}} && npm install
"""

[tasks."6-build"]
description = "Build the Vite SPA + Worker bundle (cf/dist/) — required before deploy"
depends = ["1-install"]
dir = "{{env.CF_WORKER_DIR}}"
run = "npm run build"

[tasks."10-deploy"]
description = "Full deploy: vite build + wrangler deploy. Validates CF token first."
depends = ["cf:token-check"]
dir = "{{env.CF_WORKER_DIR}}"
# fnox exec injects CLOUDFLARE_API_TOKEN from the OS keychain into the child
# process env. Without it, wrangler errors with 'Failed to fetch auth token'
# in non-interactive shells (cf:token-check only validates, doesn't export).
run = "fnox exec -- npm run deploy"

[tasks."10b-redeploy"]
description = "Re-deploy without rebuilding (fast iteration after wrangler.toml/secret changes)"
depends = ["cf:token-check"]
dir = "{{env.CF_WORKER_DIR}}"
run = "fnox exec -- wrangler deploy"

[tasks.dev]
description = "Run cf/ locally: Vite dev server + miniflare Worker. AI binding calls real CF via remote=true in wrangler.toml."
dir = "{{env.CF_WORKER_DIR}}"
# fnox exec because remote=true bindings (AI, R2) need a CF token to proxy.
run = "fnox exec -- npm run dev"

[tasks.tail]
description = "Tail live logs from the deployed Worker"
depends = ["cf:token-check"]
dir = "{{env.CF_WORKER_DIR}}"
run = "fnox exec -- wrangler tail"

[tasks.whoami]
description = "Show current Cloudflare auth identity"
run = "fnox exec -- wrangler whoami"

[tasks.login]
description = "Authenticate with Cloudflare (opens browser). Stores OAuth credentials in wrangler's local config — separate from fnox-managed CLOUDFLARE_API_TOKEN. For automation, prefer the fnox-stored token over interactive login."
run = "wrangler login"

# ── workers-rs (quick-compiler/) — Rust Worker that compiles typst → PDF ─────

[tasks."worker:check"]
description = "cargo check the workers-rs crate against wasm32"
run = "cargo check -p quick-compiler --target wasm32-unknown-unknown"

[tasks."worker:build"]
description = "Build quick-compiler.wasm via worker-build + wasm-opt -Oz --mvp-features-only --converge"
# CF Workers run V8 which only accepts MVP-ish WASM (rejects GC, custom
# descriptors, exact-heap-types — error 10021 'invalid heap type'). Use
# wasm-opt's --mvp-features flag to constrain output to MVP, and --converge
# to keep iterating optimisations until size stops shrinking.
run = """
cd crates/quick-compiler && worker-build --release
wasm-opt -Oz --mvp-features --strip-debug --strip-producers --vacuum --converge \
  build/index_bg.wasm -o build/index_bg.wasm.opt
mv build/index_bg.wasm.opt build/index_bg.wasm
echo "✓ wasm size after -Oz --mvp-features --converge:"
ls -la build/index_bg.wasm
echo -n "  gzipped: " && gzip -c build/index_bg.wasm | wc -c
"""

[tasks."worker:dev"]
description = "Run quick-compiler locally with wrangler dev"
run = "cd crates/quick-compiler && fnox exec -- wrangler dev"

[tasks."worker:deploy"]
description = "Deploy quick-compiler to Cloudflare"
depends = ["cf:token-check"]
run = "cd crates/quick-compiler && fnox exec -- wrangler deploy"

[tasks."worker:tail"]
description = "Tail logs from deployed quick-compiler"
depends = ["cf:token-check"]
run = "cd crates/quick-compiler && fnox exec -- wrangler tail"

[tasks."worker:health"]
description = "Curl GET /health on the deployed quick-compiler"
run = "curl -sf https://quick-compiler.gedw99.workers.dev/health && echo"

[tasks."prove:bindings"]
# Project-local override of the shared library task: wrangler.toml lives at
# quick/cf/, not quick/, so we run the dry-run from inside cf/. Other
# prove:* tasks (secrets/access-policy/deployed) don't apply — quick/ uses
# only ANTHROPIC_API_KEY, no CF Access, no D1.
description = "Confirm the deployed Worker's bindings via wrangler --dry-run (no upload)"
depends = ["cf:token-check"]
dir = "{{env.CF_WORKER_DIR}}"
run = "fnox exec -- wrangler deploy --dry-run --outdir /tmp/quick-dryrun 2>&1 | grep -E '^Binding|^Total Upload|env\\.|^\\s+env\\.' | head -20"

[tasks."prove:all"]
description = "Run all applicable prove:* checks. quick/ has no CF Access / fnox / D1, so only prove:bindings runs."
depends = ["prove:bindings"]
run = "echo '✓ all checks passed.'"
