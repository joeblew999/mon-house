name               = "quick-worker"
main               = "src/index.ts"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

# ── Assets (React SPA) ────────────────────────────────────────────────────────
# Vite builds the React app to .vite/dist/. Wrangler serves it as static assets.
# SPA mode: unknown paths return index.html (client-side routing).
# /agents/* is routed to the Worker first (DO WebSocket connections).
[assets]
not_found_handling = "single-page-application"
run_worker_first   = ["/agents/*", "/health"]

# ── AI ────────────────────────────────────────────────────────────────────────
[ai]
binding = "AI"
remote  = true

# ── Durable Object ────────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "PipelineAgent"
class_name = "PipelineAgent"

# ── Container — DISABLED in this deploy ──────────────────────────────────────
# typst PDF compilation runs in GitHub Actions instead (see .github/workflows/build-specs.yml).
# Re-enable when the typst-WASM-on-client spike (see CLAUDE.md) is done, or when
# the CF Container registry push issue is resolved. To re-enable: uncomment the
# DO binding + [[containers]] block + add a v4 migration adding TypstCompiler back,
# uncomment the import in src/index.ts, and uncomment the runCompile body in
# src/agent.ts.
#
# [[durable_objects.bindings]]
# name       = "typst_compiler"
# class_name = "TypstCompiler"
#
# [[containers]]
# name          = "typst_compiler"
# class_name    = "TypstCompiler"
# image         = "./Dockerfile.compiler"
# instance_type = "basic"

# Migration history — clean slate as of 2026-05-01 (worker deleted + redeployed
# after a partial Container deploy left the DO state inconsistent).
[[migrations]]
tag                = "v1"
new_sqlite_classes = ["PipelineAgent"]

# ── R2 ────────────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "SPECS_BUCKET"
bucket_name = "quick-specs"

# ── Variables ─────────────────────────────────────────────────────────────────
[vars]
QUICK_AI_BACKEND = "workers-ai"

# ── CF Workers AI model selection ─────────────────────────────────────────────
# Uncomment one. SEA-LION is recommended for Thai — fine-tuned for SE Asian languages.
# All models share 10,000 free neurons/day; beyond that: $0.011 per 1,000 neurons.
#
# Best for Thai (SE Asian fine-tune, 128k context):
#   $0.35/M input  •  $0.56/M output
QUICK_CF_MODEL = "@cf/aisingapore/gemma-sea-lion-v4-27b-it"
# Dedicated translation model, 100 languages, faster/cheaper:
#   $0.34/M input  •  $0.34/M output
# QUICK_CF_MODEL = "@cf/meta/m2m100-1.2b"
# General multilingual fallback (cheap input, expensive output):
#   $0.29/M input  •  $2.25/M output
# QUICK_CF_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Optional backends — set via wrangler secret put:
#   ANTHROPIC_API_KEY  — enables "anthropic" backend
#   OPENAI_API_KEY     — enables "openai-agents" backend
# Local dev: add to .dev.vars (gitignored)
