name               = "quick-worker"
main               = "src/index.ts"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

# ── Assets (React SPA) ────────────────────────────────────────────────────────
# Vite builds the React app to .vite/dist/. Wrangler serves it as static assets.
# SPA mode: unknown paths return index.html (client-side routing).
# /agents/* is routed to the Worker first so WebSocket upgrades reach the DO.
[assets]
not_found_handling = "single-page-application"
run_worker_first   = ["/agents/*", "/health", "/translate"]

# ── AI ────────────────────────────────────────────────────────────────────────
[ai]
binding = "AI"
remote  = true

# typst PDF compilation runs in GitHub Actions, not on the Worker — see
# .github/workflows/build-specs.yml. Future direction: typst-WASM on the
# client (and possibly also on the Worker as WASM) — see ADR 007.

# ── Durable Object — ChatAgent (spec copilot) ─────────────────────────────────
# AIChatAgent-derived class in cf/src/chat.ts. Persists message history in
# SQLite-backed DO storage so conversations survive disconnects.
[[durable_objects.bindings]]
name       = "ChatAgent"
class_name = "ChatAgent"

# ── DO migrations ─────────────────────────────────────────────────────────────
# v1: legacy PipelineAgent (translate-+-build pipeline runner; superseded by
#     the /translate HTTP endpoint + Rust CLI's chunked cache).
# v2: delete the legacy class (storage was empty in production).
# v3: introduce the new ChatAgent class (spec copilot, AIChatAgent SDK).
#     Splitting v2 + v3 because wrangler doesn't accept both deleted_classes
#     and new_sqlite_classes inside a single migration entry.
[[migrations]]
tag                = "v1"
new_sqlite_classes = ["PipelineAgent"]

[[migrations]]
tag             = "v2"
deleted_classes = ["PipelineAgent"]

[[migrations]]
tag                = "v3"
new_sqlite_classes = ["ChatAgent"]

# ── R2 ────────────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "SPECS_BUCKET"
bucket_name = "quick-specs"

# ── Variables ─────────────────────────────────────────────────────────────────
[vars]
QUICK_AI_BACKEND = "workers-ai"

# ── CF Workers AI model selection ─────────────────────────────────────────────
# Uncomment one. SEA-LION is recommended for Thai — fine-tuned for SE Asian languages.
# All models share 10,000 free neurons/day; beyond that: $0.011 per 1,000 neurons.
#
# Best for Thai (SE Asian fine-tune, 128k context):
#   $0.35/M input  •  $0.56/M output
QUICK_CF_MODEL = "@cf/aisingapore/gemma-sea-lion-v4-27b-it"
# Dedicated translation model, 100 languages, faster/cheaper:
#   $0.34/M input  •  $0.34/M output
# QUICK_CF_MODEL = "@cf/meta/m2m100-1.2b"
# General multilingual fallback (cheap input, expensive output):
#   $0.29/M input  •  $2.25/M output  •  8K output cap (vs sea-lion's ~4K)
# QUICK_CF_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Optional backends — set via wrangler secret put:
#   ANTHROPIC_API_KEY  — enables "anthropic" backend
#   OPENAI_API_KEY     — enables "openai-agents" backend
# Local dev: add to .dev.vars (gitignored)
