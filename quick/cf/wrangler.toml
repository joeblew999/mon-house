name               = "quick-worker"
main               = "src/index.ts"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

# ── Observability ─────────────────────────────────────────────────────────────
# Streams console.log output + request metadata to Workers Observability.
# Queryable via the Cloudflare dashboard or the cloudflare-observability MCP.
[observability]
enabled = true

# ── Assets (React SPA) ────────────────────────────────────────────────────────
# Vite builds the React app to .vite/dist/. Wrangler serves it as static assets.
# SPA mode: unknown paths return index.html (client-side routing).
# /agents/* is routed to the Worker first so WebSocket upgrades reach the DO.
[assets]
not_found_handling = "single-page-application"
run_worker_first   = ["/agents/*", "/health", "/translate"]

# ── AI ────────────────────────────────────────────────────────────────────────
[ai]
binding = "AI"
remote  = true

# typst PDF compilation runs in GitHub Actions, not on the Worker — see
# .github/workflows/build-specs.yml. Future direction: typst-WASM on the
# client (and possibly also on the Worker as WASM) — see ADR 007.

# ── Durable Object — ChatAgent (spec copilot) ─────────────────────────────────
# AIChatAgent-derived class in cf/src/chat.ts. Persists message history in
# SQLite-backed DO storage so conversations survive disconnects.
[[durable_objects.bindings]]
name       = "ChatAgent"
class_name = "ChatAgent"

# ── DO migrations ─────────────────────────────────────────────────────────────
# v1: legacy PipelineAgent (translate-+-build pipeline runner; superseded by
#     the /translate HTTP endpoint + Rust CLI's chunked cache).
# v2: delete the legacy class (storage was empty in production).
# v3: introduce the new ChatAgent class (spec copilot, AIChatAgent SDK).
#     Splitting v2 + v3 because wrangler doesn't accept both deleted_classes
#     and new_sqlite_classes inside a single migration entry.
[[migrations]]
tag                = "v1"
new_sqlite_classes = ["PipelineAgent"]

[[migrations]]
tag             = "v2"
deleted_classes = ["PipelineAgent"]

[[migrations]]
tag                = "v3"
new_sqlite_classes = ["ChatAgent"]

# ── Rate limit ────────────────────────────────────────────────────────────────
# Per-IP cap on the public AI surfaces (/translate + /agents/*) so a hostile
# or curious visitor can't drain the daily Workers AI budget. See COSTS.md
# for the 'why' and how to tune.
[[unsafe.bindings]]
name         = "RATE_LIMIT"
type         = "ratelimit"
namespace_id = "1001"
simple       = { limit = 60, period = 60 }   # 60 reqs / minute / IP

# ── R2 ────────────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "SPECS_BUCKET"
bucket_name = "quick-specs"

# ── Variables ─────────────────────────────────────────────────────────────────
[vars]
QUICK_AI_BACKEND = "workers-ai"

# ── CF Workers AI model selection ─────────────────────────────────────────────
# Two separate env vars so translate and chat can use different models —
# translate wants quality on technical Thai; chat wants cheap streaming on
# casual back-and-forth. The pricing column is approximate per-million-token
# cost; both share the 10K-Neurons/day free pool then $0.011 per 1K Neurons.
#
# TRANSLATE — Sea-Lion is the default because we already validated Thai
# construction-spec output on it. Bumping to llama-3.3-70b lifts quality
# at ~4x output cost; m2m100-1.2b is dedicated translation but lower
# quality on long markdown.
#
#   sea-lion-v4-27b-it           ~$0.35/M in  $0.56/M out  ← default
#   llama-3.3-70b-instruct-fp8   ~$0.29/M in  $2.25/M out
#   m2m100-1.2b                  ~$0.34/M in  $0.34/M out  (translation-only)
QUICK_CF_MODEL_TRANSLATE = "@cf/aisingapore/gemma-sea-lion-v4-27b-it"

# CHAT — Gemma 3 12B is roughly half the per-turn cost of sea-lion 27B at
# similar conversational quality. The chat agent honours a per-message
# override sent from the SPA dropdown, so this is just the default for
# clients that don't pick one.
#
#   gemma-3-12b-it               ~$0.10/M in  $0.20/M out  ← default
#   sea-lion-v4-27b-it           ~$0.35/M in  $0.56/M out  (Thai-aware)
#   llama-3.3-70b-instruct-fp8   ~$0.29/M in  $2.25/M out  (smart but pricey)
#   llama-4-scout-17b-16e-it     ~$0.20/M in  $0.85/M out  (newer mid-tier)
QUICK_CF_MODEL_CHAT = "@cf/google/gemma-3-12b-it"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Optional backends — set via wrangler secret put:
#   ANTHROPIC_API_KEY  — enables "anthropic" backend
#   OPENAI_API_KEY     — enables "openai-agents" backend
# Local dev: add to .dev.vars (gitignored)
