[package]
name    = "quick-worker"
version = "0.1.0"
edition = "2021"

# cdylib → compiled to WASM by worker-build.
# This crate is intentionally excluded from the quick/ workspace (see quick/Cargo.toml)
# because the `worker` crate only targets wasm32-unknown-unknown, not native.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Shared core — prompt text, Serde types, idempotency helpers.
# `default-features = false` omits ureq, notify, dirs — none of which work on WASM.
# The `worker` crate provides async Fetch for HTTP instead.
quick-tool = { path = "../cli", default-features = false }

# Cloudflare Workers runtime (WASM bindings, Fetch API, secrets/vars)
worker = "0.4"

# JSON serialisation for worker::Fetch bodies (worker::Body needs a String)
serde_json = "1"
