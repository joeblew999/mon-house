# mon-house Taskfile
# https://taskfile.dev
#
# This is the SINGLE SOURCE OF TRUTH for project automation.
# Claude can add new tasks here as needed.

version: '3'

# =============================================================================
# VARIABLES - Single source of truth for paths, URLs, and config
# =============================================================================
# Naming convention:
#   BIN_*  = Binary/executable names
#   DIR_*  = Directory paths
#   URL_*  = URLs
#   REPO_* = Repository info

vars:
  # Binaries (without extension - .gitignore handles both Unix and Windows)
  BIN_MON_TOOL: mon-tool

  # Directories
  DIR_TEST: examples/test
  DIR_PROD: examples/production
  DIR_FURNITURE: examples/production/furniture

  # Repository
  REPO_OWNER: joeblew999
  REPO_NAME: mon-house
  REPO_FULL: "{{.REPO_OWNER}}/{{.REPO_NAME}}"

  # URLs
  URL_PAGES_BASE: "https://{{.REPO_OWNER}}.github.io/{{.REPO_NAME}}"
  URL_FURNITURE: "{{.URL_PAGES_BASE}}/{{.DIR_FURNITURE}}/"

  # Files
  FILE_GITIGNORE: .gitignore
  FILE_VERSION: "{{.DIR_FURNITURE}}/version.txt"
  FILE_INDEX: "{{.DIR_FURNITURE}}/index.html"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # =============================================================================
  # Build
  # =============================================================================

  build:
    desc: Build mon-tool
    cmds:
      - go build -o {{.BIN_MON_TOOL}}
      - echo "✓ Built {{.BIN_MON_TOOL}}"

  clean:
    desc: Remove binary
    cmds:
      - rm -f {{.BIN_MON_TOOL}}
      - echo "✓ Cleaned"

  # =============================================================================
  # Translation Sync
  # =============================================================================

  test:
    desc: Test translation sync (safe - uses {{.DIR_TEST}}/)
    deps: [build]
    dir: "{{.DIR_TEST}}"
    cmds:
      - echo "Testing translation sync..."
      - ../../{{.BIN_MON_TOOL}} translate sync
      - echo "✓ Test complete"

  prod:
    desc: Production translation sync (uses {{.DIR_PROD}}/)
    deps: [build]
    dir: "{{.DIR_PROD}}"
    cmds:
      - echo "Production translation sync..."
      - ../../{{.BIN_MON_TOOL}} translate sync
      - echo "✓ Production sync complete"

  # =============================================================================
  # GitHub Pages
  # =============================================================================

  pages:status:
    desc: Check GitHub Pages build status
    cmds:
      - |
        status=$(gh api repos/{{.REPO_FULL}}/pages -q '.status')
        echo "GitHub Pages status: $status"
        if [ "$status" = "built" ]; then
          echo "✓ Ready to view"
        else
          echo "⏳ Still building..."
        fi

  pages:wait:
    desc: Wait for GitHub Pages build to complete
    cmds:
      - |
        echo "Waiting for GitHub Pages build..."
        while true; do
          status=$(gh api repos/{{.REPO_FULL}}/pages -q '.status')
          if [ "$status" = "built" ]; then
            echo "✓ Build complete!"
            break
          fi
          echo "  Status: $status (waiting 5s...)"
          sleep 5
        done

  pages:open:
    desc: Open GitHub Pages in browser (normal mode)
    cmds:
      - open "{{.URL_FURNITURE}}"

  pages:dev:
    desc: Open GitHub Pages in browser (dev mode - no cache)
    cmds:
      - open "{{.URL_FURNITURE}}?dev"

  # =============================================================================
  # Deploy Workflow
  # =============================================================================

  version:bump:
    desc: Bump version in version.txt (single source of truth)
    cmds:
      - |
        VERSION=$(date +%Y%m%d-%H%M%S)
        echo "$VERSION" > {{.FILE_VERSION}}
        echo "✓ Version bumped to $VERSION"

  deploy:
    desc: Bump version, commit, push, and wait for GitHub Pages
    cmds:
      - task: version:bump
      - git add {{.FILE_VERSION}}
      - git commit -m "Bump version for deploy" --allow-empty
      - git push
      - task: pages:wait
      - echo ""
      - echo "✓ Deployed! Opening in dev mode..."
      - task: pages:dev

  # =============================================================================
  # Utilities
  # =============================================================================

  gitignore:
    desc: Generate .gitignore from Taskfile variables
    cmds:
      - |
        cat > {{.FILE_GITIGNORE}} << 'EOF'
        # =============================================================================
        # AUTO-GENERATED by: task gitignore
        # Edit Taskfile.yml vars, then run: task gitignore
        # =============================================================================

        # Binaries (Unix and Windows)
        {{.BIN_MON_TOOL}}
        {{.BIN_MON_TOOL}}.exe

        # Generated files
        *_gen.*

        # Task artifacts
        tasks/

        # IDE
        .idea/
        .vscode/
        *.swp
        *.swo
        *~

        # OS
        .DS_Store
        Thumbs.db

        # Go
        *.exe
        *.exe~
        *.dll
        *.so
        *.dylib
        *.test
        *.out
        go.work
        go.work.sum

        # Playwright MCP
        .playwright-mcp/
        EOF
      - echo "✓ Generated {{.FILE_GITIGNORE}}"

  gitignore:show:
    desc: Show what would be in .gitignore (dry run)
    cmds:
      - |
        echo "# Binaries (from BIN_* vars)"
        echo "{{.BIN_MON_TOOL}}"
        echo ""
        echo "# Run 'task gitignore' to generate {{.FILE_GITIGNORE}}"

  browser:kill:
    desc: Kill stale Playwright Chrome instances
    cmds:
      - pkill -f "mcp-chrome" || true
      - echo "✓ Killed stale Playwright browsers"

  # =============================================================================
  # Local Development
  # =============================================================================

  dev:
    desc: Start local dev server for furniture SPA (port 8080)
    dir: "{{.DIR_FURNITURE}}"
    cmds:
      - |
        echo "Starting local dev server at http://localhost:8080"
        echo "Press Ctrl+C to stop"
        go run github.com/eliben/static-server@latest -port 8080

  dev:install:
    desc: Install static-server globally (optional)
    cmds:
      - go install github.com/eliben/static-server@latest
      - echo "✓ Installed static-server"
