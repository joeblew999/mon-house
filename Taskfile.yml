# mon-house Taskfile
# https://taskfile.dev
#
# This is the SINGLE SOURCE OF TRUTH for project automation.
#
# This Taskfile drives the GitHub Pages SPA (renovation docs / SVG drawings /
# furniture catalog). The construction-spec pipeline (markdown → bilingual
# PDFs for the builder) lives at quick/ and is driven by mise — see
# quick/CLAUDE.md.

version: '3'

# =============================================================================
# VARIABLES
# =============================================================================
# Naming: DIR_* = directories, URL_* = URLs, REPO_* = repo

vars:
  # Directories
  DIR_FURNITURE: examples/production/furniture

  # Repository
  REPO_OWNER: joeblew999
  REPO_NAME: mon-house
  REPO_FULL: "{{.REPO_OWNER}}/{{.REPO_NAME}}"

  # URLs
  URL_PAGES_BASE: "https://{{.REPO_OWNER}}.github.io/{{.REPO_NAME}}"
  URL_FURNITURE: "{{.URL_PAGES_BASE}}/{{.DIR_FURNITURE}}/"

  # Files
  FILE_GITIGNORE: .gitignore
  FILE_VERSION: "{{.DIR_FURNITURE}}/version.txt"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # =============================================================================
  # Development (most used)
  # =============================================================================

  dev:
    desc: Start local dev server for furniture SPA (http://localhost:8080)
    dir: "{{.DIR_FURNITURE}}"
    cmds:
      - |
        echo "Local dev server: http://localhost:8080"
        echo "Press Ctrl+C to stop"
        go run github.com/eliben/static-server@latest -port 8080

  deploy:
    desc: Bump version, push, wait for GitHub Pages, open in dev mode
    cmds:
      - task: version:bump
      - git add {{.FILE_VERSION}}
      - git commit -m "Bump version for deploy" --allow-empty
      - git push
      - task: pages:wait
      - echo ""
      - echo "✓ Deployed! Opening in dev mode..."
      - task: pages:dev

  # =============================================================================
  # GitHub Pages
  # =============================================================================

  pages:dev:
    desc: Open GitHub Pages in dev mode (bypasses cache)
    cmds:
      - open "{{.URL_FURNITURE}}?dev"

  pages:open:
    desc: Open GitHub Pages in normal mode
    cmds:
      - open "{{.URL_FURNITURE}}"

  pages:status:
    desc: Check GitHub Pages build status
    cmds:
      - |
        status=$(gh api repos/{{.REPO_FULL}}/pages -q '.status')
        echo "GitHub Pages status: $status"

  pages:wait:
    desc: Wait for GitHub Pages build to complete
    cmds:
      - |
        echo "Waiting for GitHub Pages build..."
        while true; do
          status=$(gh api repos/{{.REPO_FULL}}/pages -q '.status')
          if [ "$status" = "built" ]; then
            echo "✓ Build complete!"
            break
          fi
          echo "  Status: $status (waiting 5s...)"
          sleep 5
        done

  # =============================================================================
  # Utilities
  # =============================================================================

  version:bump:
    desc: Bump version in version.txt
    cmds:
      - |
        VERSION=$(date +%Y%m%d-%H%M%S)
        echo "$VERSION" > {{.FILE_VERSION}}
        echo "✓ Version: $VERSION"

  dev:install:
    desc: Install static-server globally (optional)
    cmds:
      - go install github.com/eliben/static-server@latest
      - echo "✓ Installed static-server"

  browser:kill:
    desc: Kill stale Playwright Chrome instances
    cmds:
      - pkill -f "mcp-chrome" || true
      - echo "✓ Killed stale browsers"

  gitignore:
    desc: Generate .gitignore from Taskfile variables
    cmds:
      - |
        cat > {{.FILE_GITIGNORE}} << 'EOF'
        # =============================================================================
        # AUTO-GENERATED by: task gitignore
        # =============================================================================

        # Generated
        *_gen.*
        tasks/

        # IDE
        .idea/
        .vscode/
        *.swp
        *.swo
        *~

        # OS
        .DS_Store
        Thumbs.db

        # Playwright
        .playwright-mcp/
        EOF
      - echo "✓ Generated {{.FILE_GITIGNORE}}"
