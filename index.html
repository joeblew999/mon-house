<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon House - House Renovation Project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      color: #24292e;
    }
    h1 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
    h2 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 24px; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid #eaecef; margin: 24px 0; }
    code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-size: 85%; }
    pre { background: #f6f8fa; padding: 16px; overflow: auto; border-radius: 6px; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid #dfe2e5; margin: 0; padding-left: 16px; color: #6a737d; }
    ul, ol { padding-left: 2em; }
    .loading { color: #6a737d; font-style: italic; }
  </style>
</head>
<body>
  <div id="content">
    <div class="loading">Loading...</div>
  </div>

  <script>
    // Simple markdown to HTML (minimal version for README)
    function md(text) {
      // Headers
      text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // Bold and italic
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');

      // Links - external (http/https)
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // Links - relative paths (keep as-is for GitHub Pages)
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

      // Inline code
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Code blocks
      text = text.replace(/```[\w]*\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

      // Horizontal rules
      text = text.replace(/^---$/gm, '<hr>');

      // Lists
      text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
      text = text.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

      // Paragraphs (lines not already wrapped)
      text = text.replace(/^(?!<[hluop]|$)(.+)$/gm, '<p>$1</p>');

      // Clean up extra newlines
      text = text.replace(/<\/p>\n<p>/g, '</p><p>');

      return text;
    }

    // Load and render README.md
    async function loadReadme() {
      try {
        var response = await fetch('README.md');
        if (!response.ok) throw new Error('Failed to load README.md');
        var text = await response.text();
        document.getElementById('content').innerHTML = md(text);
      } catch (e) {
        document.getElementById('content').innerHTML =
          '<h1>Mon House</h1>' +
          '<p>Error loading README. <a href="https://github.com/joeblew999/mon-house">View on GitHub</a></p>';
      }
    }

    loadReadme();
  </script>
</body>
</html>
