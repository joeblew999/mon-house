<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon House Furniture</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 20px 20px;
      line-height: 1.6;
      color: #24292e;
    }
    h1, h2, h3 { margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
    h1 { font-size: 2em; border-bottom: 1px solid #e1e4e8; padding-bottom: 0.3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid #e1e4e8; padding-bottom: 0.3em; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #dfe2e5; padding: 8px 12px; text-align: left; }
    th { background: #f6f8fa; font-weight: 600; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-size: 85%; }
    pre { background: #f6f8fa; padding: 16px; overflow-x: auto; border-radius: 6px; }
    pre code { background: none; padding: 0; }
    hr { border: none; border-top: 1px solid #e1e4e8; margin: 24px 0; }
    ul, ol { padding-left: 2em; }
    li { margin: 4px 0; }
    blockquote { margin: 16px 0; padding: 0 16px; border-left: 4px solid #dfe2e5; color: #6a737d; }
    strong { font-weight: 600; }

    /* Unified sticky header */
    .header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid #e1e4e8;
      margin: 0 -20px;
      padding-left: 20px;
      padding-right: 20px;
      z-index: 100;
    }
    .breadcrumb {
      font-size: 14px;
      color: #6a737d;
      display: flex;
      align-items: center;
      gap: 0;
      flex-wrap: wrap;
    }
    .breadcrumb a { color: #0366d6; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { margin: 0 8px; color: #959da5; }
    .breadcrumb .current { color: #24292e; }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .header-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #e1e4e8;
      background: #f6f8fa;
      color: #24292e;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }
    .header-btn:hover {
      background: #e1e4e8;
      text-decoration: none;
    }
    .dev-badge {
      background: #ffc107;
      color: #000;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    /* External link indicator */
    #content a[target="_blank"]::after {
      content: ' ↗';
      font-size: 0.8em;
      color: #6a737d;
    }

    /* Print styles */
    @media print {
      .header, .update-banner { display: none !important; }
      body { max-width: none; padding: 20px; }
      #content { margin-top: 0; }
      a { color: #000; text-decoration: underline; }
      a[target="_blank"]::after { content: ' (' attr(href) ')'; font-size: 0.7em; }
      h1 { page-break-before: always; }
      h1:first-child { page-break-before: avoid; }
      pre { white-space: pre-wrap; word-wrap: break-word; }
    }

    #content { margin-top: 20px; }
    .loading { text-align: center; padding: 40px; color: #6a737d; }
    .error { color: #cb2431; padding: 20px; background: #ffeef0; border-radius: 6px; }

    .update-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #0366d6;
      color: white;
      padding: 8px;
      text-align: center;
      z-index: 1001;
    }
    .update-banner button {
      margin-left: 8px;
      padding: 4px 12px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: white;
      color: #0366d6;
      font-weight: 600;
    }
    .update-banner button:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="breadcrumb" id="breadcrumb">
      <a href="#SPEC.md">🏠</a>
    </nav>
    <div class="header-actions">
      <button class="header-btn" id="toc-btn" style="display:none">↑ TOC</button>
      <button class="header-btn" id="edit-btn" style="display:none" title="Edit on GitHub (opens in new tab)">Edit ↗</button>
      <span class="dev-badge" id="dev-badge" style="display:none">DEV</span>
    </div>
  </header>
  <div id="content">
    <div class="loading">Loading...</div>
  </div>

  <script>
    // Version tracking - loaded from version.txt on first check
    // This is the ONLY source of truth (no hardcoded version in HTML)
    var loadedVersion = null;

    // Dev mode: add ?dev to URL to bypass cache (for testing after deploys)
    var DEV_MODE = window.location.search.includes('dev');
    if (DEV_MODE) {
      document.getElementById('dev-badge').style.display = 'inline-block';
    }

    // Site config loaded from root SPEC.md frontmatter
    var siteConfig = {
      leafFolders: ['shopping', 'images', 'assets']  // defaults
    };

    // Parse YAML frontmatter (simple key: [array] format)
    function parseFrontmatter(text) {
      var config = {};
      if (!text.startsWith('---')) return { config: config, content: text };

      var endIndex = text.indexOf('---', 3);
      if (endIndex === -1) return { config: config, content: text };

      var yaml = text.substring(3, endIndex).trim();
      var content = text.substring(endIndex + 3).trim();

      // Parse simple YAML (leaf_folders: [shopping, images])
      var lines = yaml.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.startsWith('leaf_folders:')) {
          var value = line.substring(13).trim();
          // Handle inline array format: [a, b, c]
          if (value.startsWith('[') && value.endsWith(']')) {
            config.leafFolders = value.slice(1, -1).split(',').map(function(s) {
              return s.trim();
            });
          }
        }
      }
      return { config: config, content: content };
    }

    // Load site config from root SPEC.md frontmatter
    async function loadSiteConfig() {
      try {
        var response = await fetch('SPEC.md?t=' + Date.now());
        if (response.ok) {
          var text = await response.text();
          var parsed = parseFrontmatter(text);
          if (parsed.config.leafFolders) {
            siteConfig.leafFolders = parsed.config.leafFolders;
          }
        }
      } catch (e) {
        console.warn('Could not load site config from SPEC.md frontmatter');
      }
    }

    // Version check - detects when page is stale and prompts/auto-refreshes
    // First call: stores version from version.txt
    // Subsequent calls: compares against stored version
    async function checkVersion() {
      try {
        var res = await fetch('version.txt?t=' + Date.now());
        if (!res.ok) return; // version.txt doesn't exist yet
        var serverVersion = (await res.text()).trim();

        if (loadedVersion === null) {
          // First check - store the version we loaded with
          loadedVersion = serverVersion;
          return;
        }

        if (serverVersion !== loadedVersion) {
          if (DEV_MODE) {
            // Auto-refresh in dev mode
            console.log('New version detected:', serverVersion, '(was:', loadedVersion + ')');
            window.location.reload(true);
          } else {
            // Show update banner in normal mode
            showUpdateBanner(serverVersion);
          }
        }
      } catch (e) { /* ignore - version.txt may not exist */ }
    }

    function showUpdateBanner(newVersion) {
      var banner = document.createElement('div');
      banner.className = 'update-banner';
      banner.innerHTML = '🔄 New version available <button onclick="location.reload(true)">Refresh</button>';
      document.body.prepend(banner);
    }

    // Check version on load (to store initial version) and periodically
    checkVersion();
    setInterval(checkVersion, 30000); // Check every 30 seconds

    // Normalize path by resolving . and .. segments
    function normalizePath(path) {
      var parts = path.split('/');
      var result = [];
      for (var i = 0; i < parts.length; i++) {
        if (parts[i] === '..') result.pop();
        else if (parts[i] !== '.' && parts[i] !== '') result.push(parts[i]);
      }
      return result.join('/');
    }

    // Get base directory from a file path
    function getBaseDir(path) {
      var parts = path.split('/');
      parts.pop(); // remove filename
      return parts.length ? parts.join('/') + '/' : '';
    }

    // Resolve relative path against base and normalize
    function resolvePath(base, rel) {
      if (rel.startsWith('http') || rel.startsWith('/')) return rel;
      return normalizePath(base + rel);
    }

    // Convert heading text to GitHub-style slug for anchor IDs
    function slugify(text) {
      return text.toLowerCase()
        .replace(/[^\w\s-]/g, '')  // Remove special chars except spaces and hyphens
        .replace(/\s+/g, '-')       // Replace spaces with hyphens
        .replace(/-+/g, '-')        // Collapse multiple hyphens
        .trim();
    }

    // Simple markdown to HTML
    function md(text, basePath) {
      var baseDir = getBaseDir(basePath);

      // Strip frontmatter if present (---\n...\n---)
      var parsed = parseFrontmatter(text);
      text = parsed.content;

      // First pass: convert links (before other processing)
      // Links with .md and optional anchor: [text](path.md) or [text](path.md#anchor)
      text = text.replace(/\[([^\]]+)\]\(([^)]+\.md(?:#[^)]*)?)\)/g, function(m, label, href) {
        // Resolve relative .md paths against current file's directory
        var resolvedHref = resolvePath(baseDir, href);
        return '<a href="#' + resolvedHref + '">' + label + '</a>';
      });
      // Pure anchor links (for TOC) - must come before external links
      text = text.replace(/\[([^\]]+)\]\((#[^)]+)\)/g, '<a href="$2">$1</a>');
      // External links
      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      // Images: ![alt](src) - resolve relative paths
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(m, alt, src) {
        var resolvedSrc = resolvePath(baseDir, src);
        return '<img src="' + resolvedSrc + '" alt="' + alt + '" style="max-width:100%;height:auto;">';
      });

      // Process line by line for better control
      var lines = text.split('\n');
      var html = [];
      var inCodeBlock = false;
      var inTable = false;
      var tableRows = [];

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        // Code blocks
        if (line.startsWith('```')) {
          if (inCodeBlock) {
            html.push('</code></pre>');
            inCodeBlock = false;
          } else {
            html.push('<pre><code>');
            inCodeBlock = true;
          }
          continue;
        }
        if (inCodeBlock) {
          html.push(line);
          continue;
        }

        // Tables
        if (line.startsWith('|')) {
          if (!inTable) inTable = true;
          // Skip separator row
          if (line.match(/^\|[\s\-:|]+\|$/)) continue;
          var cells = line.split('|').slice(1, -1).map(c => c.trim());
          var isHeader = i + 1 < lines.length && lines[i + 1].match(/^\|[\s\-:|]+\|$/);
          var tag = isHeader ? 'th' : 'td';
          tableRows.push('<tr>' + cells.map(c => '<' + tag + '>' + c + '</' + tag + '>').join('') + '</tr>');
          continue;
        } else if (inTable) {
          html.push('<table>' + tableRows.join('') + '</table>');
          tableRows = [];
          inTable = false;
        }

        // Headers (with id for anchor links)
        if (line.startsWith('### ')) {
          var t = line.slice(4);
          html.push('<h3 id="' + slugify(t) + '">' + t + '</h3>');
          continue;
        }
        if (line.startsWith('## ')) {
          var t = line.slice(3);
          html.push('<h2 id="' + slugify(t) + '">' + t + '</h2>');
          continue;
        }
        if (line.startsWith('# ')) {
          var t = line.slice(2);
          html.push('<h1 id="' + slugify(t) + '">' + t + '</h1>');
          continue;
        }

        // Horizontal rule
        if (line === '---') { html.push('<hr>'); continue; }

        // Lists
        if (line.match(/^- /)) {
          line = '<li>' + line.slice(2) + '</li>';
        } else if (line.match(/^\d+\. /)) {
          line = '<li>' + line.replace(/^\d+\. /, '') + '</li>';
        }

        // Inline formatting
        line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        line = line.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        line = line.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Blockquote
        if (line.startsWith('> ')) {
          line = '<blockquote>' + line.slice(2) + '</blockquote>';
        }

        // Wrap non-block, non-empty lines in <p> tags
        // Skip if already a block element or list item or empty
        if (line.trim() && !line.startsWith('<li>') && !line.startsWith('<blockquote>') && !line.startsWith('<img')) {
          line = '<p>' + line + '</p>';
        }

        html.push(line);
      }

      // Close any open table
      if (inTable && tableRows.length) {
        html.push('<table>' + tableRows.join('') + '</table>');
      }

      // Wrap consecutive li in ul
      var result = html.join('\n');
      result = result.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, '<ul>$&</ul>');

      return result;
    }

    // Parse hash into file path and anchor
    // Examples:
    //   #SPEC.md -> { file: 'SPEC.md', anchor: null }
    //   #living-room/SPEC.md -> { file: 'living-room/SPEC.md', anchor: null }
    //   #living-room/SPEC.md#12-coffee-table -> { file: 'living-room/SPEC.md', anchor: '12-coffee-table' }
    //   #12-coffee-table -> { file: null, anchor: '12-coffee-table' } (pure anchor)
    function parseHash() {
      var hash = window.location.hash.slice(1) || 'SPEC.md';

      // Check if it's a .md file path (possibly with anchor)
      var mdMatch = hash.match(/^(.+\.md)(?:#(.+))?$/);
      if (mdMatch) {
        return { file: mdMatch[1], anchor: mdMatch[2] || null };
      }

      // Pure anchor (no .md) - stays on current file
      return { file: null, anchor: hash };
    }

    // Track current file to detect file changes vs anchor-only changes
    var currentFile = null;

    // Auto-detect GitHub edit URL from current page location
    function getGitHubEditUrl(filePath) {
      var host = window.location.host;
      var pathname = window.location.pathname;

      // GitHub Pages: username.github.io/repo/path/to/folder/
      if (host.endsWith('.github.io')) {
        var username = host.split('.')[0];
        var parts = pathname.split('/').filter(function(p) { return p && p !== 'index.html'; });
        var repo = parts[0];
        var basePath = parts.slice(1).join('/');
        return 'https://github.com/' + username + '/' + repo + '/edit/main/' + basePath + '/' + filePath;
      }
      // Not on GitHub Pages - no edit URL
      return null;
    }

    // Scroll to anchor element if it exists
    function scrollToAnchor(anchor) {
      if (!anchor) return;
      var el = document.getElementById(anchor);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Update breadcrumb navigation
    function updateBreadcrumb(path) {
      var bc = document.getElementById('breadcrumb');
      var parts = path.replace('.md', '').split('/');
      var html = '<a href="#SPEC.md">🏠</a>';
      var accumulated = '';
      for (var i = 0; i < parts.length; i++) {
        accumulated += (i > 0 ? '/' : '') + parts[i];
        html += '<span class="sep">›</span>';
        if (i === parts.length - 1) {
          // Last part - not a link
          html += '<span class="current">' + parts[i] + '</span>';
        } else if (siteConfig.leafFolders.indexOf(parts[i]) !== -1) {
          // Leaf folder (no SPEC.md) - link back to parent category
          var parentPath = parts.slice(0, i).join('/');
          html += '<a href="#' + (parentPath ? parentPath + '/SPEC.md' : 'SPEC.md') + '">' + parts[i] + '</a>';
        } else {
          // Intermediate folder - link to its SPEC.md
          html += '<a href="#' + accumulated + '/SPEC.md">' + parts[i] + '</a>';
        }
      }
      bc.innerHTML = html;
    }

    // Load and render markdown
    async function loadPage() {
      var parsed = parseHash();
      var content = document.getElementById('content');
      var editBtn = document.getElementById('edit-btn');

      // If pure anchor (no file change), just scroll
      if (parsed.file === null && currentFile) {
        scrollToAnchor(parsed.anchor);
        return;
      }

      // Determine file to load
      var path = parsed.file || currentFile || 'SPEC.md';
      currentFile = path;

      // Update edit button (auto-detect GitHub URL - opens in new tab)
      var editBtn = document.getElementById('edit-btn');
      var editUrl = getGitHubEditUrl(normalizePath(path));
      if (editUrl) {
        editBtn.onclick = function(e) {
          e.preventDefault();
          window.open(editUrl, '_blank');
        };
        editBtn.style.display = 'inline-block';
      } else {
        editBtn.style.display = 'none';
      }

      content.innerHTML = '<div class="loading">Loading...</div>';

      try {
        // In dev mode, add cache-busting timestamp
        var fetchUrl = DEV_MODE ? path + '?t=' + Date.now() : path;
        var res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('File not found: ' + path);
        var text = await res.text();
        content.innerHTML = md(text, path);

        // Update page title and breadcrumb
        document.title = 'Mon House - ' + path.replace('.md', '').replace(/\//g, ' > ');
        updateBreadcrumb(path);

        // Intercept link clicks
        content.querySelectorAll('a[href^="#"]').forEach(function(a) {
          a.onclick = function(e) {
            e.preventDefault();
            var href = a.getAttribute('href').slice(1);

            // If pure anchor (no .md), scroll directly without changing URL
            // This keeps the URL clean and avoids reload issues
            if (!href.includes('.md')) {
              scrollToAnchor(href);
              return;
            }

            // File link - update hash (triggers hashchange -> loadPage)
            window.location.hash = href;
          };
        });

        // Scroll to anchor after content loads (if specified)
        if (parsed.anchor) {
          setTimeout(function() { scrollToAnchor(parsed.anchor); }, 50);
        }

        // Setup TOC button for this page
        setupTocButton();
      } catch (err) {
        content.innerHTML = '<div class="error">Error: ' + err.message + '</div>';
      }
    }

    // Load on hash change
    window.addEventListener('hashchange', loadPage);

    // TOC button in header - shows/hides based on scroll position
    var tocBtn = document.getElementById('toc-btn');
    var currentTocHeading = null;

    function setupTocButton() {
      // Find TOC heading (id is "table-of-contents" from slugify)
      currentTocHeading = document.getElementById('table-of-contents');
      if (!currentTocHeading) {
        // Hide button if no TOC on this page
        tocBtn.style.display = 'none';
        return;
      }

      // Setup click handler
      tocBtn.onclick = function() {
        currentTocHeading.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      // Initial visibility check
      updateTocButtonVisibility();
    }

    function updateTocButtonVisibility() {
      if (!currentTocHeading) {
        tocBtn.style.display = 'none';
        return;
      }
      var tocRect = currentTocHeading.getBoundingClientRect();
      // Show button when TOC is scrolled out of view (above viewport)
      tocBtn.style.display = tocRect.bottom < 60 ? 'inline-block' : 'none';
    }

    // Update TOC button visibility on scroll
    window.addEventListener('scroll', updateTocButtonVisibility);

    // Initial load - load config first, then page
    loadSiteConfig().then(loadPage);
  </script>
</body>
</html>
