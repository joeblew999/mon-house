name: Build Specs

on:
  push:
    branches: [main]
    paths:
      - "quick/specs/*.md"
      - "quick/specs/*.th.md"
      - "quick/specs/_partials/*.md"
      - "quick/data/**"
      - "quick/scripts/theme.typ"
      - "quick/cli/src/**"
      - "quick/cli/Cargo.toml"
      - "quick/Cargo.lock"
      - ".github/workflows/build-specs.yml"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          working_directory: quick

      # Cache Cargo registry + compiled deps keyed on Cargo.lock.
      # Invalidates when dependencies change; keeps the registry warm between runs.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            quick/target
          key: cargo-${{ runner.os }}-${{ hashFiles('quick/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Cache downloaded fonts keyed on theme.typ content.
      # Invalidates only when the font stack changes.
      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: quick/resources/fonts
          key: fonts-${{ hashFiles('quick/scripts/theme.typ') }}

      - name: Build quick-tool
        working-directory: quick
        run: mise run build-cli

      - name: Download fonts
        working-directory: quick
        run: mise run fonts

      # Drift guard: regenerate the data-driven partials and fail if they're
      # out of sync with what's committed. This catches contributors who
      # changed `data/*.json` or `data/*.nu` without running `mise run gen`
      # locally and committing the regenerated partials.
      #
      # Covers tile-quantity-*, paint-quantity-*, window-quantity-*, and
      # cost-summary-* — every partial emitted by a `data/*.nu` generator.
      #
      # Gen is fully deterministic — same JSON in, same markdown out — so
      # this never produces false positives. Unlike translation (auto-committed
      # below), generated partials must be committed explicitly by the author
      # so CI is a verification step, not a safety net for forgotten work.
      - name: Verify generated partials are up-to-date
        working-directory: quick
        run: |
          mise run gen
          if ! git diff --exit-code -- \
                specs/_partials/tile-quantity-*.md \
                specs/_partials/paint-quantity-*.md \
                specs/_partials/window-quantity-*.md \
                specs/_partials/cost-summary-*.md; then
            echo "::error::Generated partials are out of sync with data/*.json."
            echo "::error::Run \`mise run gen\` locally and commit the updated _partials/*.md files."
            exit 1
          fi

      - name: Build PDFs
        working-directory: quick
        run: mise run all

      # If `mise run all` translated any specs (the EN file changed → hash
      # mismatch → CLI called the Worker via QUICK_TRANSLATE_URL → wrote new
      # .th.md + .th.md.hash), commit those back so the repo stays in sync.
      #
      # This commit is made by the github-actions[bot] using the default
      # GITHUB_TOKEN, which by GitHub policy does NOT re-trigger workflows —
      # so there's no infinite-loop risk even without [skip ci]. The marker
      # is included anyway as belt-and-braces.
      #
      # If the build step did nothing (all hashes matched, every spec was
      # skipped) `git diff --quiet` short-circuits and this step is a no-op.
      - name: Auto-commit regenerated translations
        working-directory: quick
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pick up everything translation-related under specs/:
          #   - .th.md translations (top-level + partials)
          #   - .th.md.cache.json per-section caches (top-level + partials)
          git add specs/*.th.md \
                  specs/*.th.md.cache.json \
                  specs/_partials/*.th.md \
                  specs/_partials/*.th.md.cache.json \
                  2>/dev/null || true
          # Drop legacy .th.md.hash siblings if any are still tracked —
          # replaced by the cache files.
          git rm -f --ignore-unmatch \
                  specs/*.th.md.hash \
                  specs/_partials/*.th.md.hash \
                  2>/dev/null || true

          if git diff --cached --quiet; then
            echo "translations up to date — nothing to commit"
            exit 0
          fi
          echo "translations regenerated — committing back to main"
          git commit -m "chore(quick): auto-translate via CF Workers AI [skip ci]" \
                     -m "Generated by Build Specs workflow on commit ${GITHUB_SHA::7}."
          # If a concurrent push beat us to it, just bail — next run will catch up.
          git push origin HEAD:main || echo "push failed (likely a concurrent commit) — next run will reconcile"

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: specs-${{ github.sha }}
          path: quick/out/*.pdf
          retention-days: 90

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: specs-latest
          name: "Latest Specs"
          body: |
            Auto-built from commit ${{ github.sha }}

            **EN + Thai PDFs for all specs.**
            Download the zip or individual files below.
          files: quick/out/*.pdf
          make_latest: true
